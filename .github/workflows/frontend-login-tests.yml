name: Frontend Login Redirect — Verify target

on:
  push:
    branches: [feature/login-styling]
  pull_request:
    branches: [main]

jobs:
  e2e-login:
    name: Playwright login smoke
    runs-on: ubuntu-latest
    env:
      DEPLOYED_URL: ${{ secrets.DEPLOYED_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      LOGIN_PATH: ${{ secrets.LOGIN_PATH || '/auth/signin' }}
      EXPECTED_FINAL_PATH: ${{ secrets.EXPECTED_REDIRECT_PATH || '/team' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (use pnpm or npm as needed)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright login test (Chromium)
        run: pnpm exec playwright test e2e/login.spec.ts --browser=chromium --reporter=list
