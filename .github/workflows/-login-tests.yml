name: Frontend Login Redirect — Verify target

on:
  push:
    branches: [feature/login-styling]
  pull_request:
    branches: [main]

jobs:
  login-redirect-target:
    name: Verify /team redirects to expected login page
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.DEPLOYED_URL }}
      EXPECTED_REDIRECT_PATH: ${{ secrets.EXPECTED_REDIRECT_PATH || '/login' }}
    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Check redirect target for /team
        run: |
          set -euo pipefail

          BASE="${BASE_URL:-}"
          EXPECTED="${EXPECTED_REDIRECT_PATH:-/login}"
          TEAM_PATH="/team"

          if [ -z "$BASE" ]; then
            echo "ERROR: DEPLOYED_URL secret is not set."
            exit 1
          fi

          echo "Requesting ${BASE}${TEAM_PATH} and following redirects..."
          # follow redirects and print the final effective URL and status
          effective=$(curl -s -o /dev/null -w "%{url_effective} %{http_code}" -L "${BASE}${TEAM_PATH}" || true)
          eff_url=$(echo "$effective" | awk '{print $1}')
          eff_code=$(echo "$effective" | awk '{print $2}')

          echo " -> Effective URL after redirects: ${eff_url:-<none>}"
          echo " -> Final HTTP status: ${eff_code:-<none>}"

          if [ -z "$eff_url" ]; then
            echo "FAIL: No effective URL returned from ${BASE}${TEAM_PATH}" >&2
            exit 1
          fi

          # Extract path portion (strip scheme+host)
          eff_path="${eff_url#https://}"
          eff_path="${eff_path#http://}"
          # remove host (first slash and everything before)
          eff_path="/${eff_path#*/}"
          # remove query/hash if present
          eff_path="${eff_path%%[\?#]*}"

          echo " -> Effective path: ${eff_path}"

          if [ "$eff_path" = "$EXPECTED" ]; then
            echo "OK: /team redirected to expected path: ${EXPECTED}"
            exit 0
          else
            echo "FAIL: /team redirected to '${eff_path}', expected '${EXPECTED}'" >&2
            exit 1
            fi
