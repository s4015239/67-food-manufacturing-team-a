name: Frontend Login Redirect — Verify target

on:
  push:
    branches: [feature/login-styling]
  pull_request:
    branches: [main]

jobs:
  e2e-login:
    name: Playwright login smoke (npm)
    runs-on: ubuntu-latest
    env:
      DEPLOYED_URL: ${{ secrets.DEPLOYED_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      LOGIN_PATH: ${{'/auth/signin' }}
      EXPECTED_FINAL_PATH: ${{'/team' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (npm)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found — running 'npm install' instead"
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright login test (Chromium)
        env:
          DEPLOYED_URL: ${{ secrets.DEPLOYED_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          LOGIN_PATH: ${{'/auth/signin' }}
          EXPECTED_FINAL_PATH: ${{'/team' }}
        run: npx playwright test e2e/login.spec.ts --browser=chromium --reporter=list
